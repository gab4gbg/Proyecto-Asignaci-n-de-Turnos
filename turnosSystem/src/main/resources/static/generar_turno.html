<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitar Turno</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    /* Opciones de prioridad */
    .priority-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }

    .priority-opt {
      border: 1.5px solid var(--border);
      background: var(--bg);
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .priority-opt:hover { border-color: #93c5fd; background: var(--accent-l); }

    .priority-opt.sel-none {
      border-color: var(--accent);
      background: var(--accent-l);
    }

    .priority-opt.sel-embarazo {
      border-color: var(--amber);
      background: var(--amber-l);
    }

    .priority-opt.sel-discapacidad {
      border-color: var(--purple);
      background: var(--purple-l);
    }

    .p-icon  { font-size: 20px; display: block; margin-bottom: 5px; }
    .p-label { font-size: 12px; font-weight: 600; color: var(--text-2); }

    .priority-opt.sel-none       .p-label { color: var(--accent); }
    .priority-opt.sel-embarazo   .p-label { color: var(--amber); }
    .priority-opt.sel-discapacidad .p-label { color: var(--purple); }

    /* Tarjeta de resultado */
    .result-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      text-align: center;
      box-shadow: var(--shadow);
      animation: fadeUp 0.4s ease both;
    }

    .result-card.show { display: block; }

    .result-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
    }

    .turno-num {
      font-size: 4rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 1.5rem;
    }

    .result-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.2rem; }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--bg);
      border-radius: 8px;
      font-size: 13px;
    }

    .result-row span:first-child { color: var(--muted); font-weight: 500; }
    .result-row span:last-child  { color: var(--text);  font-weight: 600; }

    .priority-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 1.2rem;
    }

    .pill-amber  { background: var(--amber-l);  color: var(--amber); }
    .pill-purple { background: var(--purple-l); color: var(--purple); }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo-dot">Sistema de Turnos</div>
    <h1>Solicita tu turno</h1>
    <p class="subtitle">Sin registro, sin esperas innecesarias.</p>
  </div>

  <!-- Formulario -->
  <div class="card" id="formCard">

    <div class="field">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" placeholder="Ej. María García">
    </div>

    <div class="field">
      <label for="cedula">Número de cédula</label>
      <input type="text" id="cedula" placeholder="Ej. 1234567890">
    </div>

    <div class="field">
      <label>¿Requieres atención prioritaria?</label>
      <div class="priority-grid">
        <button class="priority-opt sel-none" data-value="NINGUNO" onclick="selPrioridad(this)">
          <span class="p-icon">👤</span>
          <span class="p-label">Ninguna</span>
        </button>
        <button class="priority-opt" data-value="EMBARAZO" onclick="selPrioridad(this)">
          <span class="p-icon">🤰</span>
          <span class="p-label">Embarazo</span>
        </button>
        <button class="priority-opt" data-value="DISCAPACIDAD" onclick="selPrioridad(this)">
          <span class="p-icon">♿</span>
          <span class="p-label">Discapacidad</span>
        </button>
      </div>
    </div>

    <div class="divider"></div>

    <button class="btn-primary" id="btnGenerar" onclick="generarTurno()">
      Generar turno
    </button>

    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- Resultado -->
  <div class="result-card" id="resultCard">
    <div class="result-label">Tu número de turno</div>
    <div class="turno-num" id="numeroTurno">—</div>

    <div id="pillPrioridad"></div>

    <div class="result-rows">
      <div class="result-row">
        <span>Nombre</span>
        <span id="resNombre">—</span>
      </div>
      <div class="result-row">
        <span>Cédula</span>
        <span id="resCedula">—</span>
      </div>
      <div class="result-row">
        <span>Estado</span>
        <span id="resEstado">—</span>
      </div>
    </div>

    <button class="btn-secondary" onclick="nuevoTurno()">Solicitar otro turno</button>
  </div>

  <a href="cola_turnos.html" class="nav-link">Ver cola de turnos →</a>

</div>
<script>
  const API = 'http://localhost:8080/api';
  let prioridad = 'NINGUNO';

  function selPrioridad(btn) {
    document.querySelectorAll('.priority-opt').forEach(b => {
      b.className = 'priority-opt';
    });
    const val = btn.dataset.value;
    prioridad = val;
    if (val === 'NINGUNO')      btn.classList.add('sel-none');
    if (val === 'EMBARAZO')     btn.classList.add('sel-embarazo');
    if (val === 'DISCAPACIDAD') btn.classList.add('sel-discapacidad');
  }

  async function generarTurno() {
    const nombre = document.getElementById('nombre').value.trim();
    const cedula = document.getElementById('cedula').value.trim();
    const btn    = document.getElementById('btnGenerar');
    const errEl  = document.getElementById('errorMsg');

    if (!nombre || !cedula) {
      errEl.textContent = 'Por favor completa tu nombre y número de cédula.';
      errEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Generando...';
    errEl.classList.remove('show');

    try {
      const res = await fetch(`${API}/turnos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombreUsuario: nombre, cedulaUsuario: cedula, prioridad })
      });
      if (!res.ok) throw new Error();
      const turno = await res.json();
      mostrarResultado(turno);
    } catch {
      errEl.textContent = 'No se pudo conectar con el servidor. Intenta de nuevo.';
      errEl.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Generar turno';
    }
  }

  function mostrarResultado(t) {
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('numeroTurno').textContent = t.numeroTurno;
    document.getElementById('resNombre').textContent   = t.nombreUsuario;
    document.getElementById('resCedula').textContent   = t.cedulaUsuario;
    document.getElementById('resEstado').textContent   = fmtEstado(t.estado);

    const pill = document.getElementById('pillPrioridad');
    if (t.prioridad === 'EMBARAZO') {
      pill.innerHTML = '<div class="priority-pill pill-amber">🤰 Atención prioritaria — Embarazo</div>';
    } else if (t.prioridad === 'DISCAPACIDAD') {
      pill.innerHTML = '<div class="priority-pill pill-purple">♿ Atención prioritaria — Discapacidad</div>';
    } else {
      pill.innerHTML = '';
    }

    document.getElementById('resultCard').classList.add('show');
  }

  function fmtEstado(e) {
    return { PENDIENTE:'Pendiente', EN_COLA:'En cola', LLAMADO:'Siendo atendido',
             ATENDIDO:'Atendido', CANCELADO:'Cancelado' }[e] || e;
  }

  function nuevoTurno() {
    document.getElementById('nombre').value = '';
    document.getElementById('cedula').value = '';
    document.getElementById('formCard').style.display = 'block';
    document.getElementById('resultCard').classList.remove('show');
    selPrioridad(document.querySelector('[data-value="NINGUNO"]'));
  }
</script>
</body>
</html>
