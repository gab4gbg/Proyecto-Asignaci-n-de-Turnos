<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administrador</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { justify-content: flex-start; padding: 2rem 1rem; }

        .container { max-width: 860px; }

        /* Login overlay */
        .login-overlay {
          position: fixed;
          inset: 0;
          background: var(--bg);
          z-index: 100;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 1rem;
        }

        .login-overlay.hidden { display: none; }

        .login-card {
          background: var(--surface);
          border: 0.5px solid var(--border);
          border-radius: var(--radius);
          padding: 2.5rem 2rem;
          width: 100%;
          max-width: 380px;
          animation: fadeUp 0.5s ease both;
        }

        .login-icon {
          width: 44px; height: 44px;
          background: rgba(79,142,247,0.12);
          border: 0.5px solid rgba(79,142,247,0.3);
          border-radius: 12px;
          display: flex; align-items: center; justify-content: center;
          font-size: 20px;
          margin-bottom: 1.2rem;
        }

        .login-title {
          font-family: 'DM Serif Display', serif;
          font-size: 1.6rem;
          margin-bottom: 0.3rem;
        }

        .login-sub { font-size: 13px; color: var(--muted); margin-bottom: 1.8rem; }

        /* Tabs de navegación */
        .tabs {
          display: flex;
          gap: 4px;
          background: var(--surface);
          border: 0.5px solid var(--border);
          border-radius: 10px;
          padding: 4px;
          margin-bottom: 1.5rem;
        }

        .tab {
          flex: 1;
          background: transparent;
          border: none;
          border-radius: 8px;
          padding: 9px 8px;
          font-family: 'DM Sans', sans-serif;
          font-size: 13px;
          font-weight: 400;
          color: var(--muted);
          cursor: pointer;
          transition: all 0.2s;
        }

        .tab:hover { color: var(--text); }

        .tab.active {
          background: var(--bg);
          color: var(--text);
          font-weight: 500;
          border: 0.5px solid var(--border);
        }

        /* Panel content */
        .panel { display: none; }
        .panel.active { display: block; animation: fadeUp 0.3s ease both; }

        /* Tabla de turnos */
        .table-wrap {
          overflow-x: auto;
          border: 0.5px solid var(--border);
          border-radius: var(--radius);
        }

        table {
          width: 100%;
          border-collapse: collapse;
          font-size: 13px;
        }

        thead { background: var(--surface); }

        th {
          padding: 12px 16px;
          text-align: left;
          font-size: 11px;
          font-weight: 500;
          color: var(--muted);
          text-transform: uppercase;
          letter-spacing: 0.06em;
          border-bottom: 0.5px solid var(--border);
        }

        td {
          padding: 12px 16px;
          border-bottom: 0.5px solid var(--border);
          color: var(--text);
          vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }

        .num-cell {
          font-family: 'DM Serif Display', serif;
          font-size: 1.1rem;
          color: var(--accent);
        }

        /* Badges de estado */
        .estado-badge {
          display: inline-block;
          font-size: 11px;
          font-weight: 500;
          padding: 3px 10px;
          border-radius: 999px;
        }

        .estado-EN_COLA   { background: rgba(79,142,247,0.12);  color: var(--accent); }
        .estado-LLAMADO   { background: rgba(52,211,153,0.12);  color: var(--success); }
        .estado-ATENDIDO  { background: rgba(107,114,128,0.15); color: var(--muted); }
        .estado-CANCELADO { background: rgba(239,68,68,0.12);   color: #f87171; }
        .estado-PENDIENTE { background: rgba(251,146,60,0.12);  color: var(--warn); }

        .prioridad-badge {
          display: inline-block;
          font-size: 11px;
          padding: 2px 8px;
          border-radius: 999px;
        }

        .prioridad-EMBARAZO    { background: rgba(251,146,60,0.12);  color: var(--warn); }
        .prioridad-DISCAPACIDAD{ background: rgba(167,139,250,0.12); color: var(--accent2); }

        /* Acciones de turno */
        .action-select {
          background: var(--bg);
          border: 0.5px solid var(--border);
          border-radius: 6px;
          padding: 5px 8px;
          color: var(--text);
          font-family: 'DM Sans', sans-serif;
          font-size: 12px;
          cursor: pointer;
          margin-right: 4px;
        }

        .btn-action {
          background: transparent;
          border: 0.5px solid var(--border);
          border-radius: 6px;
          padding: 5px 12px;
          color: var(--muted);
          font-family: 'DM Sans', sans-serif;
          font-size: 12px;
          cursor: pointer;
          transition: all 0.2s;
        }

        .btn-action:hover { border-color: var(--accent); color: var(--accent); }
        .btn-action.danger:hover { border-color: #f87171; color: #f87171; }

        /* Sección crear */
        .create-section {
          background: var(--surface);
          border: 0.5px solid var(--border);
          border-radius: var(--radius);
          padding: 1.5rem;
          margin-bottom: 1.2rem;
        }

        .create-title {
          font-size: 13px;
          font-weight: 500;
          color: var(--text);
          margin-bottom: 1rem;
        }

        .create-row {
          display: flex;
          gap: 8px;
          flex-wrap: wrap;
        }

        .create-row input,
        .create-row select {
          flex: 1;
          min-width: 140px;
        }

        .create-row .btn-primary {
          width: auto;
          padding: 12px 20px;
          white-space: nowrap;
        }

        /* Lista de sectores / campos */
        .item-list { display: flex; flex-direction: column; gap: 8px; }

        .list-item {
          display: flex;
          align-items: center;
          gap: 12px;
          background: var(--surface);
          border: 0.5px solid var(--border);
          border-radius: 10px;
          padding: 12px 16px;
          transition: border-color 0.2s;
        }

        .list-item:hover { border-color: var(--border); }

        .list-item-info { flex: 1; }

        .list-item-name {
          font-size: 14px;
          font-weight: 500;
          color: var(--text);
        }

        .list-item-sub {
          font-size: 12px;
          color: var(--muted);
          margin-top: 2px;
        }

        .status-dot {
          width: 8px; height: 8px;
          border-radius: 50%;
          flex-shrink: 0;
        }

        .dot-active   { background: var(--success); }
        .dot-inactive { background: var(--muted); }

        /* Toggle switch */
        .toggle {
          position: relative;
          width: 36px; height: 20px;
          flex-shrink: 0;
        }

        .toggle input { opacity: 0; width: 0; height: 0; }

        .toggle-slider {
          position: absolute;
          inset: 0;
          background: var(--border);
          border-radius: 999px;
          cursor: pointer;
          transition: background 0.2s;
        }

        .toggle-slider::before {
          content: '';
          position: absolute;
          width: 14px; height: 14px;
          left: 3px; top: 3px;
          background: white;
          border-radius: 50%;
          transition: transform 0.2s;
        }

        .toggle input:checked + .toggle-slider { background: var(--accent); }
        .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

        /* Header del panel con logout */
        .panel-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 1.5rem;
        }

        .admin-info {
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .admin-avatar {
          width: 32px; height: 32px;
          background: rgba(79,142,247,0.15);
          border: 0.5px solid rgba(79,142,247,0.3);
          border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
          font-size: 13px;
          font-weight: 500;
          color: var(--accent);
        }

        .admin-name { font-size: 13px; font-weight: 500; }

        .btn-logout {
          background: transparent;
          border: 0.5px solid var(--border);
          border-radius: 8px;
          padding: 6px 12px;
          color: var(--muted);
          font-family: 'DM Sans', sans-serif;
          font-size: 12px;
          cursor: pointer;
          transition: all 0.2s;
        }

        .btn-logout:hover { border-color: #f87171; color: #f87171; }

        /* Toast notificación */
        .toast {
          position: fixed;
          bottom: 1.5rem;
          right: 1.5rem;
          background: var(--surface);
          border: 0.5px solid var(--border);
          border-radius: 10px;
          padding: 12px 18px;
          font-size: 13px;
          color: var(--text);
          z-index: 200;
          transform: translateY(80px);
          opacity: 0;
          transition: all 0.3s ease;
          max-width: 280px;
        }

        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-color: rgba(52,211,153,0.4); color: var(--success); }
        .toast.error   { border-color: rgba(239,68,68,0.4);  color: #f87171; }

        .empty-row td {
          text-align: center;
          color: var(--muted);
          padding: 2rem;
          font-size: 13px;
        }
    </style>
</head>
<body>

<!-- Login overlay -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-card">
        <div class="login-icon">🔐</div>
        <div class="login-title">Acceso admin</div>
        <p class="login-sub">Ingresa tus credenciales para continuar</p>

        <div class="field">
            <label for="loginUser">Usuario</label>
            <input type="text" id="loginUser" placeholder="admin" autocomplete="username">
        </div>
        <div class="field">
            <label for="loginPass">Contraseña</label>
            <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
        </div>

        <div class="error-msg" id="loginError"></div>

        <button class="btn-primary" style="margin-top:1rem" onclick="iniciarSesion()">
            Ingresar
        </button>

        <a href="index.html" class="nav-link" style="margin-top:1rem">← Volver al inicio</a>
    </div>
</div>

<!-- Panel principal -->
<div class="container" id="mainPanel" style="display:none">

    <div class="panel-header">
        <div class="admin-info">
            <div class="admin-avatar" id="adminAvatar">A</div>
            <div>
                <div class="admin-name" id="adminName">Administrador</div>
                <div style="font-size:11px;color:var(--muted)">Panel de gestión</div>
            </div>
        </div>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" onclick="cambiarTab('turnos', this)">Turnos</button>
        <button class="tab" onclick="cambiarTab('sectores', this)">Sectores</button>
        <button class="tab" onclick="cambiarTab('campos', this)">Campos</button>
    </div>

    <!-- ── Panel Turnos ── -->
    <div class="panel active" id="panel-turnos">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Turno</th>
                    <th>Nombre</th>
                    <th>Cédula</th>
                    <th>Prioridad</th>
                    <th>Estado</th>
                    <th>Sector</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody id="tablaTurnos">
                <tr class="empty-row"><td colspan="7">Cargando turnos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ── Panel Sectores ── -->
    <div class="panel" id="panel-sectores">
        <div class="create-section">
            <div class="create-title">Crear nuevo sector</div>
            <div class="create-row">
                <input type="text" id="inputSector" placeholder="Ej. Sector C, Caja, Servicio al cliente...">
                <button class="btn-primary" onclick="crearSector()">Crear sector</button>
            </div>
        </div>
        <div class="item-list" id="listaSectores"></div>
    </div>

    <!-- ── Panel Campos ── -->
    <div class="panel" id="panel-campos">
        <div class="create-section">
            <div class="create-title">Agregar campo al formulario</div>
            <div class="create-row">
                <input type="text" id="inputEtiqueta" placeholder="Etiqueta (ej. Teléfono)">
                <select id="inputTipo">
                    <option value="texto">Texto</option>
                    <option value="numero">Número</option>
                    <option value="fecha">Fecha</option>
                </select>
                <input type="number" id="inputOrden" placeholder="Orden" min="1" style="max-width:90px">
                <button class="btn-primary" onclick="crearCampo()">Agregar</button>
            </div>
        </div>
        <div class="item-list" id="listaCampos"></div>
    </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    const API = 'http://localhost:8080/api';
    let authHeader = '';
    let sectores   = [];

    // ── Auth ─────────────────────────────────────────────────────────

    function iniciarSesion() {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();

      if (!user || !pass) {
        mostrarLoginError('Completa usuario y contraseña.');
        return;
      }

      authHeader = 'Basic ' + btoa(`${user}:${pass}`);

      // Verificar credenciales con una llamada real al backend
      fetch(`${API}/sectores/todos`, { headers: { 'Authorization': authHeader } })
        .then(res => {
          if (res.status === 401) throw new Error('Credenciales incorrectas');
          if (!res.ok) throw new Error('Error del servidor');
          return res.json();
        })
        .then(() => {
          document.getElementById('loginOverlay').classList.add('hidden');
          document.getElementById('mainPanel').style.display = 'block';
          document.getElementById('adminName').textContent = user;
          document.getElementById('adminAvatar').textContent = user.charAt(0).toUpperCase();
          cargarTodo();
        })
        .catch(e => mostrarLoginError(e.message));
    }

    function cerrarSesion() {
      authHeader = '';
      document.getElementById('loginOverlay').classList.remove('hidden');
      document.getElementById('mainPanel').style.display = 'none';
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
    }

    function mostrarLoginError(msg) {
      const el = document.getElementById('loginError');
      el.textContent = msg;
      el.classList.add('show');
    }

    // Enter en los campos de login
    document.getElementById('loginPass').addEventListener('keydown', e => {
      if (e.key === 'Enter') iniciarSesion();
    });

    // ── Tabs ─────────────────────────────────────────────────────────

    function cambiarTab(tab, btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`panel-${tab}`).classList.add('active');
    }

    // ── Carga general ────────────────────────────────────────────────

    function cargarTodo() {
      cargarTurnos();
      cargarSectores();
      cargarCampos();
    }

    // ── Turnos ───────────────────────────────────────────────────────

    async function cargarTurnos() {
      const res    = await fetch(`${API}/turnos/cola`, { headers: { 'Authorization': authHeader } });
      const turnos = await res.json();
      const tbody  = document.getElementById('tablaTurnos');

      if (turnos.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="7">No hay turnos activos</td></tr>';
        return;
      }

      tbody.innerHTML = turnos.map(t => `
        <tr>
          <td class="num-cell">${t.numeroTurno}</td>
          <td>${t.nombreUsuario}</td>
          <td style="color:var(--muted)">${t.cedulaUsuario}</td>
          <td>${t.prioridad !== 'NINGUNO'
            ? `<span class="prioridad-badge prioridad-${t.prioridad}">${t.prioridad === 'EMBARAZO' ? '🤰' : '♿'} ${t.prioridad}</span>`
            : '<span style="color:var(--muted);font-size:12px">—</span>'
          }</td>
          <td><span class="estado-badge estado-${t.estado}">${formatEstado(t.estado)}</span></td>
          <td style="color:var(--muted);font-size:12px">${t.sector ? t.sector.nombre : '—'}</td>
          <td>
            <select class="action-select" id="sector-${t.id}">
              <option value="">Asignar sector...</option>
              ${sectores.map(s => `<option value="${s.id}" ${t.sector?.id === s.id ? 'selected' : ''}>${s.nombre}</option>`).join('')}
            </select>
            <button class="btn-action" onclick="asignarSector(${t.id})">Asignar</button>
            <select class="action-select" id="estado-${t.id}" style="margin-left:4px">
              ${['EN_COLA','LLAMADO','ATENDIDO','CANCELADO'].map(e =>
                `<option value="${e}" ${t.estado === e ? 'selected' : ''}>${formatEstado(e)}</option>`
              ).join('')}
            </select>
            <button class="btn-action" onclick="cambiarEstado(${t.id})">Cambiar</button>
          </td>
        </tr>
      `).join('');
    }

    async function asignarSector(turnoId) {
      const sectorId = document.getElementById(`sector-${turnoId}`).value;
      if (!sectorId) { toast('Selecciona un sector primero', 'error'); return; }

      await fetch(`${API}/turnos/${turnoId}/sector`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': authHeader },
        body: JSON.stringify({ sectorId: parseInt(sectorId) })
      });

      toast('Sector asignado correctamente', 'success');
      cargarTurnos();
    }

    async function cambiarEstado(turnoId) {
      const nuevoEstado = document.getElementById(`estado-${turnoId}`).value;

      await fetch(`${API}/turnos/${turnoId}/estado`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': authHeader },
        body: JSON.stringify({ nuevoEstado })
      });

      toast('Estado actualizado', 'success');
      cargarTurnos();
    }

    // ── Sectores ─────────────────────────────────────────────────────

    async function cargarSectores() {
      const res = await fetch(`${API}/sectores/todos`, { headers: { 'Authorization': authHeader } });
      sectores  = await res.json();
      const lista = document.getElementById('listaSectores');

      if (sectores.length === 0) {
        lista.innerHTML = '<p style="color:var(--muted);font-size:13px;padding:1rem 0">No hay sectores creados aún.</p>';
        return;
      }

      lista.innerHTML = sectores.map(s => `
        <div class="list-item">
          <div class="status-dot ${s.activo ? 'dot-active' : 'dot-inactive'}"></div>
          <div class="list-item-info">
            <div class="list-item-name">${s.nombre}</div>
            <div class="list-item-sub">${s.activo ? 'Activo' : 'Inactivo'}</div>
          </div>
          <label class="toggle">
            <input type="checkbox" ${s.activo ? 'checked' : ''}
              onchange="toggleSector(${s.id}, this.checked)">
            <span class="toggle-slider"></span>
          </label>
        </div>
      `).join('');
    }

    async function crearSector() {
      const nombre = document.getElementById('inputSector').value.trim();
      if (!nombre) { toast('Escribe un nombre para el sector', 'error'); return; }

      const res = await fetch(`${API}/sectores`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': authHeader },
        body: JSON.stringify({ nombre })
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        toast(data.message || 'Ya existe un sector con ese nombre', 'error');
        return;
      }

      document.getElementById('inputSector').value = '';
      toast(`Sector "${nombre}" creado`, 'success');
      cargarSectores();
    }

    async function toggleSector(id, activo) {
      await fetch(`${API}/sectores/${id}/estado`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': authHeader },
        body: JSON.stringify({ activo })
      });

      toast(`Sector ${activo ? 'activado' : 'desactivado'}`, 'success');
      cargarSectores();
    }

    // ── Campos de formulario ─────────────────────────────────────────

    async function cargarCampos() {
      const res    = await fetch(`${API}/campos/todos`, { headers: { 'Authorization': authHeader } });
      const campos = await res.json();
      const lista  = document.getElementById('listaCampos');

      if (campos.length === 0) {
        lista.innerHTML = '<p style="color:var(--muted);font-size:13px;padding:1rem 0">No hay campos configurados aún.</p>';
        return;
      }

      lista.innerHTML = campos.map(c => `
        <div class="list-item">
          <div class="status-dot ${c.activo ? 'dot-active' : 'dot-inactive'}"></div>
          <div class="list-item-info">
            <div class="list-item-name">${c.etiqueta}</div>
            <div class="list-item-sub">
              Tipo: ${c.tipo} · Orden: ${c.orden} · ${c.requerido ? 'Requerido' : 'Opcional'}
            </div>
          </div>
          <label class="toggle">
            <input type="checkbox" ${c.activo ? 'checked' : ''}
              onchange="toggleCampo(${c.id}, this.checked)">
            <span class="toggle-slider"></span>
          </label>
        </div>
      `).join('');
    }

    async function crearCampo() {
      const etiqueta = document.getElementById('inputEtiqueta').value.trim();
      const tipo     = document.getElementById('inputTipo').value;
      const orden    = parseInt(document.getElementById('inputOrden').value) || 1;

      if (!etiqueta) { toast('Escribe una etiqueta para el campo', 'error'); return; }

      await fetch(`${API}/campos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': authHeader },
        body: JSON.stringify({ etiqueta, tipo, requerido: true, orden })
      });

      document.getElementById('inputEtiqueta').value = '';
      document.getElementById('inputOrden').value    = '';
      toast(`Campo "${etiqueta}" agregado`, 'success');
      cargarCampos();
    }

    async function toggleCampo(id, activo) {
      await fetch(`${API}/campos/${id}/estado`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': authHeader },
        body: JSON.stringify({ activo })
      });

      toast(`Campo ${activo ? 'activado' : 'desactivado'}`, 'success');
      cargarCampos();
    }

    // ── Utilidades ───────────────────────────────────────────────────

    function formatEstado(e) {
      return { EN_COLA:'En cola', LLAMADO:'Atendiendo', ATENDIDO:'Atendido',
               CANCELADO:'Cancelado', PENDIENTE:'Pendiente' }[e] || e;
    }

    let toastTimer;
    function toast(msg, tipo = 'success') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className   = `toast ${tipo} show`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
    }
</script>
</body>
</html>
