<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Turno</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          background: #f0f2f5;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 2rem 1rem;
        }

        .container { width: 100%; max-width: 440px; }

        .header { text-align: center; margin-bottom: 1.8rem; }

        .badge {
          display: inline-block;
          background: #dbeafe; color: #1d4ed8;
          font-size: 12px; font-weight: 600;
          padding: 4px 14px; border-radius: 999px;
          margin-bottom: 0.8rem;
        }

        h1 {
          font-size: 1.8rem; font-weight: 800;
          color: #111827; letter-spacing: -0.02em;
          margin-bottom: 0.3rem;
        }

        .subtitle { font-size: 14px; color: #6b7280; }

        .card {
          background: #fff;
          border: 1px solid #e5e7eb;
          border-radius: 14px;
          padding: 1.8rem;
        }

        .field { margin-bottom: 1.1rem; }

        label {
          display: block;
          font-size: 13px; font-weight: 600;
          color: #374151; margin-bottom: 6px;
        }

        input[type="text"] {
          width: 100%;
          background: #f9fafb;
          border: 1.5px solid #e5e7eb;
          border-radius: 9px;
          padding: 11px 14px;
          font-family: inherit; font-size: 15px;
          color: #111827; outline: none;
          transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="text"]:focus {
          border-color: #2563eb;
          box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
          background: #fff;
        }

        input::placeholder { color: #9ca3af; }

        .prioridad-label {
          font-size: 13px; font-weight: 600;
          color: #374151; margin-bottom: 8px;
        }

        .prioridad-grid {
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          gap: 8px;
        }

        .p-btn {
          border: 1.5px solid #e5e7eb;
          background: #f9fafb;
          border-radius: 10px;
          padding: 12px 6px;
          text-align: center;
          cursor: pointer;
          transition: all 0.15s;
          font-family: inherit;
        }

        .p-btn:hover { border-color: #93c5fd; background: #eff6ff; }

        .p-btn.active-none       { border-color: #2563eb; background: #eff6ff; }
        .p-btn.active-embarazo   { border-color: #d97706; background: #fffbeb; }
        .p-btn.active-discapacidad { border-color: #7c3aed; background: #f5f3ff; }

        .p-icon  { font-size: 20px; display: block; margin-bottom: 4px; }

        .p-text  { font-size: 12px; font-weight: 600; color: #6b7280; }
        .p-btn.active-none       .p-text { color: #2563eb; }
        .p-btn.active-embarazo   .p-text { color: #d97706; }
        .p-btn.active-discapacidad .p-text { color: #7c3aed; }

        .divider { height: 1px; background: #f3f4f6; margin: 1.4rem 0; }

        .btn {
          width: 100%; background: #2563eb; color: #fff;
          border: none; border-radius: 9px; padding: 13px;
          font-family: inherit; font-size: 15px; font-weight: 600;
          cursor: pointer; transition: background 0.15s;
        }

        .btn:hover   { background: #1d4ed8; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .spinner {
          display: inline-block;
          width: 14px; height: 14px;
          border: 2px solid rgba(255,255,255,0.4);
          border-top-color: #fff;
          border-radius: 50%;
          animation: spin 0.7s linear infinite;
          vertical-align: middle; margin-right: 6px;
        }

        .error {
          display: none;
          background: #fef2f2; border: 1px solid #fecaca;
          border-radius: 8px; padding: 10px 14px;
          font-size: 13px; color: #dc2626; margin-top: 12px;
        }
        .error.show { display: block; }

        /* Resultado */
        .result {
          display: none;
          background: #fff; border: 1px solid #e5e7eb;
          border-radius: 14px; padding: 2rem; text-align: center;
        }
        .result.show { display: block; }

        .result-label {
          font-size: 12px; font-weight: 600; color: #9ca3af;
          text-transform: uppercase; letter-spacing: 0.06em;
          margin-bottom: 0.4rem;
        }

        .turno-numero {
          font-size: 4.5rem; font-weight: 800;
          color: #2563eb; letter-spacing: -0.04em;
          line-height: 1; margin-bottom: 1.4rem;
        }

        .result-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.2rem; }

        .result-row {
          display: flex; justify-content: space-between;
          padding: 10px 14px; background: #f9fafb;
          border-radius: 8px; font-size: 13px;
        }

        .result-row .key   { color: #6b7280; font-weight: 500; }
        .result-row .val   { color: #111827; font-weight: 600; }

        .p-tag {
          display: inline-block; font-size: 12px; font-weight: 600;
          padding: 5px 14px; border-radius: 999px; margin-bottom: 1.2rem;
        }

        .btn-sec {
          width: 100%; background: transparent;
          border: 1.5px solid #e5e7eb; border-radius: 9px; padding: 11px;
          font-family: inherit; font-size: 14px; font-weight: 500;
          color: #6b7280; cursor: pointer; transition: all 0.15s; margin-top: 8px;
        }
        .btn-sec:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }

        .nav-link {
          display: block; text-align: center; margin-top: 1.2rem;
          font-size: 13px; font-weight: 500; color: #9ca3af;
          text-decoration: none; transition: color 0.15s;
        }
        .nav-link:hover { color: #2563eb; }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <div class="badge">Sistema de Turnos</div>
        <h1>Solicita tu turno</h1>
        <p class="subtitle">Sin registro, sin esperas innecesarias.</p>
    </div>

    <!-- Formulario -->
    <div class="card" id="formCard">
        <div class="field">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" placeholder="Ej. María García">
        </div>

        <div class="field">
            <label for="cedula">Número de cédula</label>
            <input type="text" id="cedula" placeholder="Ej. 1234567890">
        </div>

        <div class="field">
            <div class="prioridad-label">¿Requieres atención prioritaria?</div>
            <div class="prioridad-grid">
                <button class="p-btn active-none" data-val="NINGUNO" onclick="selP(this)">
                    <span class="p-icon">👤</span>
                    <span class="p-text">Ninguna</span>
                </button>
                <button class="p-btn" data-val="EMBARAZO" onclick="selP(this)">
                    <span class="p-icon">🤰</span>
                    <span class="p-text">Embarazo</span>
                </button>
                <button class="p-btn" data-val="DISCAPACIDAD" onclick="selP(this)">
                    <span class="p-icon">♿</span>
                    <span class="p-text">Discapacidad</span>
                </button>
            </div>
        </div>

        <div class="divider"></div>

        <button class="btn" id="btnGen" onclick="generar()">Generar turno</button>
        <div class="error" id="errMsg"></div>
    </div>

    <!-- Resultado -->
    <div class="result" id="resultCard">
        <div class="result-label">Tu número de turno</div>
        <div class="turno-numero" id="resNumero">—</div>
        <div id="resPTag"></div>
        <div class="result-rows">
            <div class="result-row"><span class="key">Nombre</span><span class="val" id="resNombre">—</span></div>
            <div class="result-row"><span class="key">Cédula</span><span class="val" id="resCedula">—</span></div>
            <div class="result-row"><span class="key">Estado</span><span class="val" id="resEstado">—</span></div>
        </div>
        <button class="btn-sec" onclick="reiniciar()">Solicitar otro turno</button>
    </div>

    <a href="cola_turnos.html" class="nav-link">Ver cola de turnos →</a>
    <a href="index.html" class="nav-link" style="margin-top:6px">← Volver al inicio</a>
</div>

<script>
    const API = 'https://proyecto-asignaci-n-de-turnos.onrender.com/api';
    let prioridad = 'NINGUNO';

    function selP(btn) {
      document.querySelectorAll('.p-btn').forEach(b => b.className = 'p-btn');
      prioridad = btn.dataset.val;
      if (prioridad === 'NINGUNO')      btn.classList.add('active-none');
      if (prioridad === 'EMBARAZO')     btn.classList.add('active-embarazo');
      if (prioridad === 'DISCAPACIDAD') btn.classList.add('active-discapacidad');
    }

    async function generar() {
      const nombre = document.getElementById('nombre').value.trim();
      const cedula = document.getElementById('cedula').value.trim();
      const btn    = document.getElementById('btnGen');
      const err    = document.getElementById('errMsg');

      if (!nombre || !cedula) {
        err.textContent = 'Por favor completa tu nombre y número de cédula.';
        err.classList.add('show'); return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Generando...';
      err.classList.remove('show');

      try {
        const res = await fetch(`${API}/turnos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombreUsuario: nombre, cedulaUsuario: cedula, prioridad })
        });
        if (!res.ok) throw new Error();
        mostrar(await res.json());
      } catch {
        err.textContent = 'No se pudo conectar con el servidor. Intenta de nuevo.';
        err.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Generar turno';
      }
    }

    function mostrar(t) {
      document.getElementById('formCard').style.display = 'none';
      document.getElementById('resNumero').textContent = t.numeroTurno;
      document.getElementById('resNombre').textContent = t.nombreUsuario;
      document.getElementById('resCedula').textContent = t.cedulaUsuario;
      document.getElementById('resEstado').textContent = fmtEstado(t.estado);

      const tag = document.getElementById('resPTag');
      if (t.prioridad === 'EMBARAZO') {
        tag.innerHTML = '<div class="p-tag" style="background:#fffbeb;color:#d97706">🤰 Atención prioritaria — Embarazo</div>';
      } else if (t.prioridad === 'DISCAPACIDAD') {
        tag.innerHTML = '<div class="p-tag" style="background:#f5f3ff;color:#7c3aed">♿ Atención prioritaria — Discapacidad</div>';
      } else { tag.innerHTML = ''; }

      document.getElementById('resultCard').classList.add('show');
    }

    function fmtEstado(e) {
      return { PENDIENTE:'Pendiente', EN_COLA:'En cola', LLAMADO:'Siendo atendido',
               ATENDIDO:'Atendido', CANCELADO:'Cancelado' }[e] || e;
    }

    function reiniciar() {
      document.getElementById('nombre').value = '';
      document.getElementById('cedula').value = '';
      document.getElementById('formCard').style.display = 'block';
      document.getElementById('resultCard').classList.remove('show');
      selP(document.querySelector('[data-val="NINGUNO"]'));
    }
</script>
</body>
</html>
