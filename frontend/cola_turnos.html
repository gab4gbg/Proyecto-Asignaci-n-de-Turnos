<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cola de Turnos</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Turno siendo atendido */
    .atendiendo {
      display: none;
      background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
      border: 1.5px solid #93c5fd;
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.2rem;
      animation: fadeUp 0.4s ease both;
    }

    .atendiendo.show { display: block; }

    .atendiendo-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }

    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.5s ease infinite;
    }

    .atendiendo-num  { font-size: 2.8rem; font-weight: 800; color: var(--accent); letter-spacing: -0.03em; line-height: 1; }
    .atendiendo-name { font-size: 13px; color: var(--muted); margin-top: 3px; font-weight: 500; }

    /* Contadores */
    .counters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 1.2rem;
    }

    .counter {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.2rem;
      box-shadow: var(--shadow);
    }

    .counter-num   { font-size: 2rem; font-weight: 800; color: var(--text); letter-spacing: -0.03em; line-height: 1; }
    .counter-label { font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 3px; }

    /* Header de sección */
    .section-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-title { font-size: 13px; font-weight: 600; color: var(--text-2); }

    .refresh-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-l); }
    .refresh-icon { transition: transform 0.4s; }
    .refresh-btn.spin .refresh-icon { transform: rotate(360deg); }

    /* Items de turno */
    .turno-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
      transition: border-color 0.15s, transform 0.15s;
      animation: fadeUp 0.3s ease both;
    }

    .turno-item:hover { border-color: #93c5fd; transform: translateX(2px); }

    .pos-num  { font-size: 12px; font-weight: 700; color: #b8b3ac; min-width: 20px; }
    .t-num    { font-size: 1.3rem; font-weight: 800; color: var(--accent); letter-spacing: -0.02em; min-width: 60px; }
    .t-info   { flex: 1; }
    .t-name   { font-size: 14px; font-weight: 600; color: var(--text); }
    .t-cedula { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .p-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .tag-amber  { background: var(--amber-l);  color: var(--amber); }
    .tag-purple { background: var(--purple-l); color: var(--purple); }

    /* Estado vacío */
    .empty {
      display: none;
      text-align: center;
      padding: 3rem 1rem;
    }

    .empty.show { display: block; }
    .empty-icon  { font-size: 2.5rem; margin-bottom: 0.8rem; opacity: 0.35; }
    .empty-title { font-size: 15px; font-weight: 600; color: var(--text-2); }
    .empty-sub   { font-size: 13px; color: var(--muted); margin-top: 4px; }

    /* Auto refresh */
    .auto-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: #b8b3ac;
      margin-top: 1.2rem;
      animation: fadeUp 0.5s ease 0.2s both;
    }

    .green-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s ease infinite;
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo-dot">Sistema de Turnos</div>
    <h1>Cola de espera</h1>
    <p class="subtitle">Actualización automática cada 15 segundos.</p>
  </div>

  <!-- Turno siendo atendido -->
  <div class="atendiendo" id="atendiendo">
    <div class="atendiendo-label">
      <div class="live-dot"></div>
      Atendiendo ahora
    </div>
    <div class="atendiendo-num"  id="atendiendoNum">—</div>
    <div class="atendiendo-name" id="atendiendoName">—</div>
  </div>

  <!-- Contadores -->
  <div class="counters">
    <div class="counter">
      <div class="counter-num"   id="cntEspera">0</div>
      <div class="counter-label">En espera</div>
    </div>
    <div class="counter">
      <div class="counter-num"   id="cntPrioritarios">0</div>
      <div class="counter-label">Prioritarios</div>
    </div>
  </div>

  <!-- Lista -->
  <div class="card" style="padding: 1.5rem;">
    <div class="section-row">
      <span class="section-title">Turnos en espera</span>
      <button class="refresh-btn" id="refreshBtn" onclick="cargar()">
        <span class="refresh-icon">↻</span> Actualizar
      </button>
    </div>

    <div id="listaTurnos"></div>
    <div class="empty" id="empty">
      <div class="empty-icon">✓</div>
      <div class="empty-title">Sin turnos en espera</div>
      <div class="empty-sub">La cola está vacía por el momento</div>
    </div>
  </div>

  <div class="auto-info">
    <div class="green-dot"></div>
    Actualizando automáticamente
  </div>

  <a href="generar_turno.html" class="nav-link">← Solicitar un turno</a>

</div>
<script>
  const API = 'http://localhost:8080/api';

  async function cargar() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('spin');

    try {
      const res  = await fetch(`${API}/turnos/cola`);
      const cola = await res.json();
      render(cola);
    } catch (e) {
      console.error(e);
    } finally {
      setTimeout(() => btn.classList.remove('spin'), 400);
    }
  }

  function render(cola) {
    const llamado  = cola.find(t => t.estado === 'LLAMADO');
    const espera   = cola.filter(t => t.estado === 'EN_COLA');
    const atDiv    = document.getElementById('atendiendo');

    if (llamado) {
      document.getElementById('atendiendoNum').textContent  = llamado.numeroTurno;
      document.getElementById('atendiendoName').textContent = llamado.nombreUsuario;
      atDiv.classList.add('show');
    } else {
      atDiv.classList.remove('show');
    }

    const prioritarios = espera.filter(t => t.prioridad !== 'NINGUNO').length;
    document.getElementById('cntEspera').textContent      = espera.length;
    document.getElementById('cntPrioritarios').textContent = prioritarios;

    const lista = document.getElementById('listaTurnos');
    const empty = document.getElementById('empty');
    lista.innerHTML = '';

    if (espera.length === 0) { empty.classList.add('show'); return; }
    empty.classList.remove('show');

    espera.forEach((t, i) => {
      const tag = t.prioridad !== 'NINGUNO'
        ? `<span class="p-tag ${t.prioridad === 'EMBARAZO' ? 'tag-amber' : 'tag-purple'}">
             ${t.prioridad === 'EMBARAZO' ? '🤰 Prioritario' : '♿ Prioritario'}
           </span>` : '';

      const el = document.createElement('div');
      el.className = 'turno-item';
      el.style.animationDelay = `${i * 0.04}s`;
      el.innerHTML = `
        <div class="pos-num">${i + 1}</div>
        <div class="t-num">${t.numeroTurno}</div>
        <div class="t-info">
          <div class="t-name">${t.nombreUsuario}</div>
          <div class="t-cedula">C.C. ${t.cedulaUsuario}</div>
        </div>
        ${tag}
      `;
      lista.appendChild(el);
    });
  }

  cargar();
  setInterval(cargar, 15000);
</script>
</body>
</html>
